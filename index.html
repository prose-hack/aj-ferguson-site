<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AJ Ferguson</title>
<meta name="description" content="AJ Ferguson. Knowledge, made ready for people and AI.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:#111;font-family:'Cormorant Garamond',Georgia,serif}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:0 7vw}
main{text-align:center;opacity:0;animation:in 1.4s ease .2s forwards}
@keyframes in{to{opacity:1}}
h1{font-weight:300;font-size:clamp(46px,9vw,124px);letter-spacing:-.01em;line-height:1;margin:0}
.tag{font-weight:400;font-size:clamp(11px,1.05vw,14px);letter-spacing:.34em;text-transform:uppercase;color:#8a8a8a;margin:clamp(18px,2.4vw,30px) 0 0;line-height:1.7}
.burger{position:fixed;top:clamp(22px,3vw,36px);left:clamp(22px,3vw,40px);width:28px;height:20px;background:none;border:0;padding:0;cursor:pointer;z-index:3}
.burger span{display:block;height:1px;background:#111;margin:0 0 8px;transition:transform .35s,opacity .35s}
.open .burger span:nth-child(1){transform:translateY(9px) rotate(45deg)}.open .burger span:nth-child(2){opacity:0}.open .burger span:nth-child(3){transform:translateY(-9px) rotate(-45deg)}
nav{position:fixed;inset:0;background:#fff;display:flex;align-items:center;padding-left:clamp(40px,10vw,160px);opacity:0;pointer-events:none;transition:opacity .4s;z-index:2}
.open nav{opacity:1;pointer-events:auto}
nav ul{list-style:none;margin:0;padding:0}nav li{margin:0 0 clamp(10px,1.6vw,18px)}
nav a{font-weight:300;font-size:clamp(34px,5vw,64px);color:#111;text-decoration:none;letter-spacing:-.005em}
nav a:hover{color:#8a8a8a}
.soon{font-weight:300;font-size:clamp(34px,5vw,64px);color:#c4c4c4;letter-spacing:-.005em;cursor:default}
nav small{display:block;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#aaa;margin-top:4px}
</style></head>
<body>
<button class="burger" aria-label="Menu" onclick="document.body.classList.toggle('open')"><span></span><span></span><span></span></button>
<nav><ul>
<li><span class="soon">Now<small>Soon</small></span></li>
<li><span class="soon">Work<small>Soon</small></span></li>
<li><span class="soon">Writing<small>Soon</small></span></li>
<li><span class="soon">The Last Resort<small>Soon</small></span></li>
<li><a href="https://www.linkedin.com/in/aj-ferguson/">LinkedIn</a></li>
</ul></nav>
<main><h1>AJ Ferguson</h1><p class="tag">Knowledge, made ready for people and AI</p></main>
<script>if(location.hash=='#menu')document.body.classList.add('open')</script>
</body></html>
